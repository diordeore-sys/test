        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, h6, .heading-font {

        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #cc0000;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff0000;
        }
        
        /* Grain Texture Overlay */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Glitch Animation for VHS feel */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-hover:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: #cc0000;
        }

        /* Red Glow */
        .red-glow:hover {
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.6);
            border-color: #cc0000;
        }

        /* Hide scrollbar for horizontal scroll areas but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        const CartContext = React.createContext();

        const CartProvider = ({ children }) => {
            const [cart, setCart] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('cyere_cart')) || [];
                } catch { return []; }
            });

            useEffect(() => {
                localStorage.setItem('cyere_cart', JSON.stringify(cart));
            }, [cart]);

            const addToCart = (product, size) => {
                setCart([...cart, { ...product, size, cartId: Date.now() }]);
            };

            const removeFromCart = (cartId) => {
                setCart(cart.filter(item => item.cartId !== cartId));
            };

            const cartTotal = cart.reduce((sum, item) => sum + item.price, 0);

            return (
                <CartContext.Provider value={{ cart, addToCart, removeFromCart, cartTotal }}>
                    {children}
                </CartContext.Provider>
            );
        };

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {siteConfig.videos.items.map((video, idx) => (
                                <div key={idx} className="relative group cursor-pointer" onClick={() => setActiveVideo(video.youtubeId)}>
                                    <div className="aspect-video bg-black overflow-hidden border border-white/10 group-hover:border-red-600 transition-all duration-300">
                                        <img src={video.thumbnail} alt={video.title} className="w-full h-full object-cover opacity-60 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500 grayscale group-hover:grayscale-0" />
                                        <div className="absolute inset-0 flex items-center justify-center">
                                            <div className="w-16 h-16 rounded-full border-2 border-white flex items-center justify-center text-white group-hover:bg-red-600 group-hover:border-red-600 transition-all duration-300">
                                                {Icons.play}
                                            </div>
                                        </div>
                                    </div>
                                    <h3 className="mt-4 text-xl text-white font-bold tracking-wide heading-font group-hover:text-red-600 transition-colors">{video.title}</h3>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Video Modal */}
                    {activeVideo && (
                        <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4" onClick={() => setActiveVideo(null)}>
                            <div className="w-full max-w-5xl aspect-video bg-black relative">
                                <iframe 
                                    width="100%" 
                                    height="100%" 
                                    src={`https://www.youtube.com/embed/${activeVideo}?autoplay=1`} 
                                    title="YouTube video player" 
                                    frameBorder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowFullScreen
                                ></iframe>
                                <button className="absolute -top-10 right-0 text-white hover:text-red-600" onClick={() => setActiveVideo(null)}>
                                    {Icons.close}
                                </button>
                            </div>
                        </div>
                    )}
                </section>
            );
        };

        const About = () => {
            return (
                <section id="about" className="py-24 bg-black relative overflow-hidden">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
                            <div className="relative">
                                <div className="absolute -inset-4 border border-red-600/30 translate-x-4 translate-y-4" />
                                <img 
                                    src={siteConfig.about.image} 
                                    alt="Avery Cyere" 
                                    className="relative w-full grayscale contrast-125 hover:grayscale transition-all duration-700"
                                />
                            </div>
                            <div>
                                <h2 className="text-5xl md:text-7xl font-bold text-white mb-8 heading-font">{siteConfig.about.heading}</h2>
                                <div className="space-y-6 mb-12">
                                    {siteConfig.about.bio.map((paragraph, idx) => (
                                        <p key={idx} className="text-gray-300 leading-relaxed font-mono text-sm md:text-base">
                                            {paragraph}
                                        </p>
                                    ))}
                                </div>
                                <blockquote className="border-l-4 border-red-600 pl-6 py-2">
                                    <p className="text-2xl md:text-3xl text-red-600 italic heading-font">
                                        "{siteConfig.about.quote}"
                                    </p>
                                    <cite className="block mt-4 text-white not-italic tracking-widest text-sm">— {siteConfig.about.quoteAuthor}</cite>
                                </blockquote>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Photos = () => {
            const [lightbox, setLightbox] = useState(null);

            return (
                <section id="photos" className="py-24 bg-neutral-950">
                    <div className="max-w-7xl mx-auto px-6">
                        <h2 className="text-5xl md:text-7xl font-bold text-red-600 mb-16 heading-font">{siteConfig.photos.heading}</h2>
                        
                        <div className="columns-1 md:columns-2 lg:columns-3 gap-4 space-y-4">
                            {siteConfig.photos.images.map((img, idx) => (
                                <div 
                                    key={idx} 
                                    className="break-inside-avoid relative group cursor-pointer overflow-hidden border border-white/5 hover:border-red-600 transition-all duration-300"
                                    onClick={() => setLightbox(img.src)}
                                >
                                    <img 
                                        src={img.src} 
                                        alt={img.alt} 
                                        className="w-full grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700"
                                    />
                                    <div className="absolute inset-0 bg-red-600/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300" />
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Lightbox */}
                    {lightbox && (
                        <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4" onClick={() => setLightbox(null)}>
                            <img src={lightbox} className="max-w-full max-h-[90vh] object-contain border-2 border-red-600" alt="Full view" />
                            <button className="absolute top-6 right-6 text-white hover:text-red-600" onClick={() => setLightbox(null)}>
                                {Icons.close}
                            </button>
                        </div>
                    )}
                </section>
            );
        };

        const Blog = () => {
            const [expanded, setExpanded] = useState({});

            const toggleExpand = (id) => {
                setExpanded(prev => ({ ...prev, [id]: !prev[id] }));
            };

            return (
                <section id="blog" className="py-24 bg-black">
                    <div className="max-w-3xl mx-auto px-6">
                        <h2 className="text-5xl md:text-7xl font-bold text-white mb-16 heading-font">{siteConfig.blog.heading}</h2>
                        
                        <div className="space-y-16">
                            {siteConfig.blog.posts.map((post) => (
                                <article key={post.id} className="border-b border-white/10 pb-12">
                                    <div className="text-red-600 text-sm font-mono mb-2">{post.date}</div>
                                    <h3 className="text-2xl font-bold text-white mb-4 heading-font hover:text-red-600 transition-colors cursor-pointer">
                                        {post.title}
                                    </h3>
                                    
                                    {post.type === 'quote' ? (
                                        <blockquote className="text-xl italic text-gray-300 border-l-2 border-red-600 pl-4 my-4">
                                            {post.content}
                                        </blockquote>
                                    ) : (
                                        <p className={`text-gray-400 leading-relaxed font-mono ${expanded[post.id] ? '' : 'line-clamp-3'}`}>
                                            {post.content}
                                        </p>
                                    )}
                                    
                                    <div className="mt-4 flex items-center justify-between">
                                        <div className="flex gap-2">
                                            {post.tags.map(tag => (
                                                <span key={tag} className="text-xs text-red-600">#{tag}</span>
                                            ))}
                                        </div>
                                        {post.type !== 'quote' && (
                                            <button 
                                                onClick={() => toggleExpand(post.id)}
                                                className="text-xs uppercase tracking-widest text-white hover:text-red-600 transition-colors"
                                            >
                                                {expanded[post.id] ? 'Read Less' : 'Read More'}
                                            </button>
                                        )}
                                    </div>
                                </article>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Merch = () => {
            const { addToCart } = useCart();
            const [selectedSizes, setSelectedSizes] = useState({});

            const handleSizeSelect = (productId, size) => {
                setSelectedSizes(prev => ({ ...prev, [productId]: size }));
            };

            return (
                <section id="merch" className="py-24 bg-neutral-950">
                    <div className="max-w-7xl mx-auto px-6">
                        <h2 className="text-5xl md:text-7xl font-bold text-red-600 mb-16 heading-font">{siteConfig.merch.heading}</h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                            {siteConfig.merch.products.map((product) => (
                                <div key={product.id} className="group bg-black border border-white/10 hover:border-red-600 transition-all duration-300 red-glow">
                                    <div className="aspect-[4/5] overflow-hidden relative">
                                        <img 
                                            src={product.image} 
                                            alt={product.name} 
                                            className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500"
                                        />
                                    </div>
                                    <div className="p-6">
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="text-xl font-bold text-white heading-font">{product.name}</h3>
                                            <span className="text-xl text-red-600 font-mono">${product.price}</span>
                                        </div>
                                        <p className="text-gray-400 text-sm mb-6 font-mono">{product.description}</p>
                                        
                                        <div className="flex gap-2 mb-6">
                                            {product.sizes.map(size => (
                                                <button
                                                    key={size}
                                                    onClick={() => handleSizeSelect(product.id, size)}
                                                    className={`w-10 h-10 border text-xs font-mono transition-all ${
                                                        selectedSizes[product.id] === size 
                                                        ? 'bg-red-600 border-red-600 text-white' 
                                                        : 'border-white/30 text-white hover:border-red-600'
                                                    }`}
                                                >
                                                    {size}
                                                </button>
                                            ))}
                                        </div>
                                        
                                        <button 
                                            onClick={() => {
                                                if (selectedSizes[product.id]) {
                                                    addToCart(product, selectedSizes[product.id]);
                                                    alert(`Added ${product.name} (${selectedSizes[product.id]}) to cart`);
                                                } else {
                                                    alert("Please select a size");
                                                }
                                            }}
                                            className="w-full bg-red-600 text-white py-3 text-sm tracking-widest hover:bg-white hover:text-black transition-all duration-300 font-bold"
                                        >
                                            ADD TO CART
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Connect = () => {
            return (
                <section id="connect" className="py-24 bg-black relative">
                    <div className="max-w-4xl mx-auto px-6 text-center">
                        <h2 className="text-5xl md:text-8xl font-bold text-red-600 mb-12 heading-font">{siteConfig.connect.heading}</h2>
                        
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-6 mb-20">
                            {siteConfig.connect.links.map((link) => (
                                <a 
                                    key={link.platform}
                                    href={link.url}
                                    target="_blank"
                                    rel="noreferrer"
                                    className="flex flex-col items-center justify-center p-6 border border-white/20 hover:border-red-600 hover:bg-red-600/10 transition-all duration-300 group glitch-hover"
                                >
                                    <div className="text-white group-hover:text-red-600 mb-3 transition-colors">
                                        {Icons[link.icon]}
                                    </div>
                                    <span className="text-xs tracking-widest text-white uppercase">{link.platform}</span>
                                    {link.handle && <span className="text-[10px] text-gray-500 mt-1">{link.handle}</span>}
                                </a>
                            ))}
                        </div>

                        <div className="max-w-md mx-auto">
                            <h3 className="text-xl text-white mb-6 tracking-widest">{siteConfig.connect.newsletter.heading}</h3>
                            <form className="flex border border-white/30 focus-within:border-red-600 transition-colors" onSubmit={(e) => e.preventDefault()}>
                                <input 
                                    type="email" 
                                    placeholder={siteConfig.connect.newsletter.placeholder}
                                    className="flex-1 bg-transparent p-4 text-white placeholder-gray-600 outline-none font-mono text-sm"
                                />
                                <button className="px-6 text-white hover:text-red-600 transition-colors text-xl">
                                    {siteConfig.connect.newsletter.buttonText}
                                </button>
                            </form>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => {
            return (
                <footer className="py-12 bg-black border-t border-white/10">
                    <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center">
                        <p className="text-xs text-gray-500 font-mono mb-4 md:mb-0">{siteConfig.footer.copyright}</p>
                        <p className="text-xs text-red-600 font-mono">{siteConfig.footer.credits}</p>
                    </div>
                </footer>
            );
        };

        const App = () => {
            return (
                <CartProvider>
                    <div className="min-h-screen bg-black text-white selection:bg-red-600 selection:text-white">
                        <Nav />
                        <Hero />
                        <Music />
                        <Videos />
                        <About />
                        <Photos />
                        <Blog />
                        <Merch />
                        <Connect />
                        <Footer />
                    </div>
                </CartProvider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
